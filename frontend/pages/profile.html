<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    
    
    <script src="../js/config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex text-text">

    <!-- Sidebar -->
    <aside class="w-64 bg-surface h-screen sticky top-0 border-r-2 border-text border-dashed p-6 flex flex-col hidden md:flex">
        <img src="../../assets/images/logo.png" alt="CourseAlign" class="h-20 mx-auto mb-10">
        
        <nav class="flex-grow space-y-4">
            <a href="dashboard.html" class="block p-3 doodle-border hover:bg-gray-100 transition">Dashboard</a>
            <a href="courses.html" class="block p-3 doodle-border hover:bg-gray-100 transition">Browse Courses</a>
        </nav>
        
        <div class="mt-auto">
            <a href="profile.html" class="block p-3 text-center bg-primary doodle-border font-bold text-text mb-2">My Profile</a>
            <button onclick="logout()" class="w-full text-center text-red-600 font-bold hover:underline">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8">
        
        <!-- Mobile Header -->
        <header class="md:hidden flex justify-between items-center mb-6 doodle-border p-4 bg-surface">
            <span class="text-xl font-bold text-secondary">CourseAlign</span>
            <button class="doodle-button px-4 py-2" onclick="history.back()">Back</button>
        </header>

        <!-- Profile Header -->
        <div class="doodle-border bg-primary p-6 md:p-10 mb-8 relative overflow-hidden flex items-center gap-6">
            <div class="w-24 h-24 bg-surface rounded-full doodle-border flex items-center justify-center text-secondary text-4xl font-bold z-10" id="profile-avatar">
                U
            </div>
            <div class="relative z-10">
                <h1 id="profile-name" class="text-3xl md:text-4xl font-bold mb-2">Loading...</h1>
                <p id="profile-role" class="text-lg opacity-90 capitalize">Role</p>
            </div>
            <!-- Decorative circle -->
            <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-white opacity-20 rounded-full border-4 border-dashed border-white"></div>
        </div>

        <!-- Details Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- Account Info -->
            <div class="doodle-border p-6 bg-surface">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold text-secondary">Account Information</h3>
                </div>
                
                <div id="error-message" class="text-red-500 font-bold mb-4 hidden"></div>
                <div id="success-message" class="text-success font-bold mb-4 hidden">Profile updated successfully!</div>

                <form id="profile-form" class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-500 font-bold mb-1">Username</label>
                        <input type="text" id="info-username" class="w-full p-2 border-2 border-text border-dashed rounded bg-surface font-bold focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 font-bold mb-1">Email</label>
                        <input type="email" id="info-email" class="w-full p-2 border-2 border-text border-dashed rounded bg-surface font-bold focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 font-bold mb-1">Level</label>
                        <select id="info-level" class="w-full p-2 border-2 border-text border-dashed rounded bg-surface font-bold focus:outline-none focus:border-primary">
                            <option value="100L">100L</option>
                            <option value="200L">200L</option>
                            <option value="300L">300L</option>
                            <option value="400L">400L</option>
                            <option value="500L">500L</option>
                            <option value="Graduated">Graduated</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-500 font-bold mb-1">Role (Read Only)</label>
                        <span id="info-role" class="font-bold text-lg p-2 border-2 border-text border-dashed block rounded bg-gray-50 capitalize text-gray-500">...</span>
                    </div>

                    <div class="mt-6">
                        <button type="submit" class="doodle-button bg-primary text-text font-bold w-full" id="save-btn">Save Changes</button>
                    </div>
                </form>
            </div>

            <!-- Preferences (Placeholder) -->
            <div class="doodle-border p-6 bg-surface">
                <h3 class="text-xl font-bold text-secondary mb-4">Preferences</h3>
                <div class="space-y-4">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" checked class="form-checkbox h-5 w-5 text-primary doodle-border">
                        <span class="font-bold text-lg">Email Notifications</span>
                    </label>
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" class="form-checkbox h-5 w-5 text-primary doodle-border">
                        <span class="font-bold text-lg">Dark Mode Theme</span>
                    </label>
                </div>
            </div>

        </div>
    </main>
    <script src="../js/profile.js"></script>
</body>
</html>
