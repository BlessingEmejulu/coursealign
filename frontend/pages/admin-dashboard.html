<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    
    
    <script src="../js/config.js"></script>

    <!-- Tailwind CSS (Play CDN for Vanilla HTML/JS setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#49B6E5', secondary: '#263D5B', success: '#16A34A', warning: '#D97706', danger: '#DC2626', surface: '#FFFFFF', text: '#111827' },
                    fontFamily: { sans: ['"Delius Swash Caps"', 'cursive'], mono: ['"JetBrains Mono"', 'monospace'] },
                    animation: { 'bounce-slow': 'bounce 3s infinite', 'wiggle': 'wiggle 1s ease-in-out infinite' },
                    keyframes: { wiggle: { '0%, 100%': { transform: 'rotate(-3deg)' }, '50%': { transform: 'rotate(3deg)' } } }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex text-text">

    <!-- Sidebar -->
    <aside class="w-64 bg-surface h-screen sticky top-0 border-r-2 border-text border-dashed p-6 flex flex-col hidden md:flex">
        <img src="../assets/images/logo.png" alt="CourseAlign" class="h-20 mx-auto mb-10">
        
        <nav class="flex-grow space-y-4">
            <a href="admin-dashboard.html" class="block p-3 doodle-border bg-primary text-text font-bold">Admin Portal</a>
        </nav>
        
        <div class="mt-auto">
            <button onclick="logout()" class="w-full text-center text-danger font-bold hover:underline">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8 overflow-y-auto">
        
        <div class="doodle-border bg-secondary text-white p-6 md:p-10 mb-8 relative overflow-hidden flex justify-between items-center">
            <div class="relative z-10">
                <h1 id="welcome-msg" class="text-3xl md:text-4xl font-bold mb-2">Admin Portal</h1>
                <p class="text-lg opacity-90">Manage system users and global courses.</p>
            </div>
            <div class="relative z-10 hidden md:block">
                <button onclick="openCreateModal()" class="doodle-button bg-surface text-secondary shadow-lg text-lg">+ Create New Course</button>
            </div>
        </div>

        <!-- Mobile Create Button -->
        <div class="mb-8 md:hidden">
            <button onclick="openCreateModal()" class="doodle-button bg-secondary text-white w-full text-lg">+ Create New Course</button>
        </div>

        <!-- Metrics Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div class="doodle-border p-6 bg-surface border-primary">
                <h3 class="text-lg font-bold text-gray-500 uppercase tracking-wide">Total Users</h3>
                <p id="totalUsersCount" class="text-4xl font-bold mt-2">...</p>
            </div>
            <div class="doodle-border p-6 bg-surface border-success">
                <h3 class="text-lg font-bold text-gray-500 uppercase tracking-wide">Total Courses</h3>
                <p id="totalCoursesCount" class="text-4xl font-bold mt-2">...</p>
            </div>
        </div>

        <!-- Manage Users -->
        <h3 class="text-2xl font-bold text-secondary mb-4">Manage Users</h3>
        <div class="doodle-border bg-surface overflow-x-auto mb-10">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 border-b-2 border-dashed border-text">
                        <th class="p-4 font-bold">ID</th>
                        <th class="p-4 font-bold">Username</th>
                        <th class="p-4 font-bold">Email</th>
                        <th class="p-4 font-bold">Role</th>
                        <th class="p-4 font-bold text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="5" class="p-4 text-center">Loading users...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Manage Courses -->
        <h3 class="text-2xl font-bold text-secondary mb-4">Manage Courses</h3>
        <div class="doodle-border bg-surface overflow-x-auto mb-10">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 border-b-2 border-dashed border-text">
                        <th class="p-4 font-bold">ID</th>
                        <th class="p-4 font-bold">Code</th>
                        <th class="p-4 font-bold">Title</th>
                        <th class="p-4 font-bold">Lecturer</th>
                        <th class="p-4 font-bold text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="coursesTableBody">
                    <tr><td colspan="5" class="p-4 text-center">Loading courses...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Create Course Modal -->
    <div id="createModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="doodle-border bg-surface p-6 max-w-lg w-full">
            <h2 class="text-2xl font-bold mb-4">Create New Course</h2>
            <form id="createCourseForm" class="space-y-4">
                <div>
                    <label class="block font-bold">Course Code</label>
                    <input type="text" id="ccode" class="doodle-input w-full" placeholder="e.g. CSC101" required>
                </div>
                <div>
                    <label class="block font-bold">Course Title</label>
                    <input type="text" id="ctitle" class="doodle-input w-full" placeholder="e.g. Intro to Computer Science" required>
                </div>
                <div>
                    <label class="block font-bold">Credit Units</label>
                    <input type="number" id="cunit" class="doodle-input w-full" required min="0">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block font-bold">Level</label>
                        <select id="clevel" class="doodle-input w-full">
                            <option value="100">100</option>
                            <option value="200">200</option>
                            <option value="300">300</option>
                            <option value="400">400</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block font-bold">Semester</label>
                        <select id="csem" class="doodle-input w-full">
                            <option value="1st">1st Semester</option>
                            <option value="2nd">2nd Semester</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeCreateModal()" class="doodle-button flex-1 bg-gray-200">Cancel</button>
                    <button type="submit" class="doodle-button flex-1 bg-success text-white">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit Course Modal -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="doodle-border bg-surface p-6 max-w-lg w-full">
            <h2 class="text-2xl font-bold mb-4">Edit Course</h2>
            <form id="editCourseForm" class="space-y-4">
                <div>
                    <label class="block font-bold">Course Code</label>
                    <input type="text" id="edit_ccode" class="doodle-input w-full" required>
                </div>
                <div>
                    <label class="block font-bold">Course Title</label>
                    <input type="text" id="edit_ctitle" class="doodle-input w-full" required>
                </div>
                <div>
                    <label class="block font-bold">Credit Units</label>
                    <input type="number" id="edit_cunit" class="doodle-input w-full" required min="0">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block font-bold">Level</label>
                        <select id="edit_clevel" class="doodle-input w-full">
                            <option value="100">100</option>
                            <option value="200">200</option>
                            <option value="300">300</option>
                            <option value="400">400</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block font-bold">Semester</label>
                        <select id="edit_csem" class="doodle-input w-full">
                            <option value="1st">1st Semester</option>
                            <option value="2nd">2nd Semester</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeEditModal()" class="doodle-button flex-1 bg-gray-200">Cancel</button>
                    <button type="submit" class="doodle-button flex-1 bg-primary text-white">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
