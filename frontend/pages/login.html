<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#49B6E5', secondary: '#263D5B', surface: '#FFFFFF', text: '#111827' } } }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="doodle-border p-8 max-w-md w-full bg-surface">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-secondary mb-2">Welcome Back!</h1>
            <p class="text-gray-600">Log in to continue your learning journey.</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold mb-2">Username or Email</label>
                <input type="text" id="username" class="doodle-input" placeholder="e.g. john_doe" required>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" class="doodle-input" placeholder="••••••••" required>
                <div class="text-right mt-2">
                    <a href="forgot-password.html" class="text-sm text-primary hover:underline font-bold">Forgot Password?</a>
                </div>
            </div>
            
            <button type="submit" class="doodle-button text-white w-full py-3 text-lg mt-4">Login</button>
        </form>
        
        <div class="mt-6 text-center">
            <p>Don't have an account? <a href="register.html" class="text-primary font-bold hover:underline">Register here</a></p>
        </div>
        <div class="mt-4 text-center">
            <a href="index.html" class="text-gray-500 hover:text-secondary hover:underline text-sm">Back to Home</a>
        </div>
    </div>
    
    <script>
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch(e) {
                return null;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            
            try {
                btn.innerText = 'Logging in...';
                btn.disabled = true;
                
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });
                
                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('token', data.access_token);
                    
                    const payload = parseJwt(data.access_token);
                    if (payload && payload.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else if (payload && payload.role === 'lecturer') {
                        window.location.href = 'lecturer-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    const errorData = await response.json();
                    alert(errorData.detail || 'Incorrect username or password');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Login error:', error);
                alert('Failed to communicate with the server.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
