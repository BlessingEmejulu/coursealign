<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    

    
    <script src="../js/config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="doodle-border p-8 max-w-md w-full bg-surface">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-secondary mb-2">Welcome Back!</h1>
            <p class="text-gray-600">Log in to continue your learning journey.</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold mb-2">Username or Email</label>
                <input type="text" id="username" class="doodle-input" placeholder="e.g. john_doe" required>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" class="doodle-input" placeholder="••••••••" required>
                <div class="text-right mt-2">
                    <a href="forgot-password.html" class="text-sm text-primary hover:underline font-bold">Forgot Password?</a>
                </div>
            </div>
            
            <button type="submit" class="doodle-button text-white w-full py-3 text-lg mt-4">Login</button>
        </form>
        
        <div class="mt-6 text-center">
            <p>Don't have an account? <a href="register.html" class="text-primary font-bold hover:underline">Register here</a></p>
        </div>
        <div class="mt-4 text-center">
            <a href="index.html" class="text-gray-500 hover:text-secondary hover:underline text-sm">Back to Home</a>
        </div>
    </div>
    
    <script src="../js/login.js"></script>
</body>
</html>
