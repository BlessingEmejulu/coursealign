<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#49B6E5', secondary: '#263D5B', success: '#16A34A', warning: '#D97706', surface: '#FFFFFF', text: '#111827' } } }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="doodle-border p-8 max-w-md w-full bg-surface">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-secondary mb-2">Reset Password</h1>
            <p class="text-gray-600">Enter your details to create a new password.</p>
        </div>
        
        <form id="resetForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" class="doodle-input" placeholder="e.g. john_doe" required>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Email Address</label>
                <input type="email" id="email" class="doodle-input" placeholder="john@example.com" required>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">New Password</label>
                <input type="password" id="new_password" class="doodle-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="doodle-button text-white w-full py-3 text-lg mt-4">Reset Password</button>
        </form>
        
        <div class="mt-6 text-center">
            <p>Remembered your password? <a href="login.html" class="text-primary font-bold hover:underline">Login here</a></p>
        </div>
    </div>
    
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const new_password = document.getElementById('new_password').value;
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            
            try {
                btn.innerText = 'Resetting...';
                btn.disabled = true;
                
                const response = await fetch('http://localhost:8000/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, new_password })
                });
                
                if (response.ok) {
                    alert('Password successfully reset! You can now login with your new password.');
                    window.location.href = 'login.html';
                } else {
                    const errorData = await response.json();
                    alert(errorData.detail || 'Failed to reset password. Please check your details.');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred. Is the backend running?');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
