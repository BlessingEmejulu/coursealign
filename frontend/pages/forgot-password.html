<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    
    
    <script src="../js/config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="doodle-border p-8 max-w-md w-full bg-surface">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-secondary mb-2">Reset Password</h1>
            <p class="text-gray-600">Enter your details to create a new password.</p>
        </div>
        
        <form id="resetForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold mb-2">Username</label>
                <input type="text" id="username" class="doodle-input" placeholder="e.g. john_doe" required>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">Email Address</label>
                <input type="email" id="email" class="doodle-input" placeholder="john@example.com" required>
            </div>
            <div>
                <label class="block text-sm font-bold mb-2">New Password</label>
                <input type="password" id="new_password" class="doodle-input" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="doodle-button text-white w-full py-3 text-lg mt-4">Reset Password</button>
        </form>
        
        <div class="mt-6 text-center">
            <p>Remembered your password? <a href="login.html" class="text-primary font-bold hover:underline">Login here</a></p>
        </div>
    </div>
    
    <script src="../js/forgot-password.js"></script>
</body>
</html>
