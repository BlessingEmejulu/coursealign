<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#49B6E5', secondary: '#263D5B', surface: '#FFFFFF', text: '#111827' } } }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="doodle-border p-8 max-w-md w-full bg-surface">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-secondary mb-2">Join CourseAlign</h1>
            <p class="text-gray-600">Create an account to start tracking your courses.</p>
        </div>
        
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-bold mb-1">Username</label>
                <input type="text" id="username" class="doodle-input" placeholder="Choose a username" required>
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">Email</label>
                <input type="email" id="email" class="doodle-input" placeholder="your@email.com" required>
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">Password</label>
                <input type="password" id="password" class="doodle-input" placeholder="Create a password" required>
            </div>
            <div>
                <label class="block text-sm font-bold mb-1">I am a...</label>
                <select id="role" class="doodle-input bg-surface cursor-pointer">
                    <option value="student">Student</option>
                    <option value="lecturer">Lecturer</option>
                </select>
            </div>
            
            <button type="submit" class="doodle-button text-white w-full py-3 text-lg mt-6">Create Account</button>
        </form>
        
        <div class="mt-6 text-center">
            <p>Already have an account? <a href="login.html" class="text-primary font-bold hover:underline">Log in</a></p>
        </div>
        <div class="mt-4 text-center">
            <a href="index.html" class="text-gray-500 hover:text-secondary hover:underline text-sm">Back to Home</a>
        </div>
    </div>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            
            try {
                btn.innerText = 'Creating account...';
                btn.disabled = true;
                
                const response = await fetch('http://localhost:8000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password, role })
                });
                
                if (response.ok) {
                    alert('Registration successful! Please log in.');
                    window.location.href = 'login.html';
                } else {
                    const errorData = await response.json();
                    alert(errorData.detail || 'Registration failed');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('Failed to communicate with the server.');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
