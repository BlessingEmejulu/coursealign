<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Dashboard - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    
    
    <script src="../js/config.js"></script>

    <!-- Tailwind CSS (Play CDN for Vanilla HTML/JS setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#49B6E5', secondary: '#263D5B', success: '#16A34A', warning: '#D97706', danger: '#DC2626', surface: '#FFFFFF', text: '#111827' },
                    fontFamily: { sans: ['"Delius Swash Caps"', 'cursive'], mono: ['"JetBrains Mono"', 'monospace'] },
                    animation: { 'bounce-slow': 'bounce 3s infinite', 'wiggle': 'wiggle 1s ease-in-out infinite' },
                    keyframes: { wiggle: { '0%, 100%': { transform: 'rotate(-3deg)' }, '50%': { transform: 'rotate(3deg)' } } }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex text-text">

    <!-- Sidebar -->
    <aside class="w-64 bg-surface h-screen sticky top-0 border-r-2 border-text border-dashed p-6 flex flex-col hidden md:flex">
        <img src="../assets/images/logo.png" alt="CourseAlign" class="h-20 mx-auto mb-10">
        
        <nav class="flex-grow space-y-4">
            <a href="lecturer-dashboard.html" class="block p-3 doodle-border bg-primary text-text font-bold">My Courses</a>
        </nav>
        
        <div class="mt-auto">
            <button onclick="logout()" class="w-full text-center text-red-600 font-bold hover:underline">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8">
        
        <!-- Welcome Banner -->
        <div class="doodle-border bg-primary p-6 md:p-10 mb-8 relative overflow-hidden flex justify-between items-center">
            <div class="relative z-10">
                <h1 id="welcome-msg" class="text-3xl md:text-4xl font-bold mb-2">Lecturer Portal</h1>
                <p class="text-lg opacity-90">Manage your course outlines and provide resources to students.</p>
            </div>
            <div class="relative z-10 hidden md:block">
                <button onclick="openSelectModal()" class="doodle-button bg-surface text-secondary shadow-lg">+ Select Course</button>
            </div>
        </div>
        
        <!-- Mobile Create Button -->
        <div class="mb-8 md:hidden">
            <button onclick="openSelectModal()" class="doodle-button bg-secondary text-white w-full">+ Select Course</button>
        </div>

        <h3 class="text-2xl font-bold text-secondary mb-4">Courses You Teach</h3>

        <!-- Dashboard Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="courseGrid">
            <!-- Courses fetched here -->
        </div>
    </main>

    <!-- Select Course Modal -->
    <div id="selectModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="doodle-border bg-surface p-6 max-w-lg w-full">
            <h2 class="text-2xl font-bold mb-4">Select Course to Teach</h2>
            <form id="selectCourseForm" class="space-y-4">
                <div>
                    <label class="block font-bold">Course Code</label>
                    <select id="ccode" class="doodle-input w-full" required onchange="handleCourseSelection()">
                        <option value="">Select a course...</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold">Course Title</label>
                    <input type="text" id="ctitle" class="doodle-input w-full bg-gray-100" readonly placeholder="Course Title will appear here">
                </div>
                <div>
                    <label class="block font-bold">Description</label>
                    <textarea id="cdescription" class="doodle-input w-full" rows="3" placeholder="Brief course description..."></textarea>
                </div>
                <div>
                    <label class="block font-bold">Credit Units</label>
                    <input type="number" id="cunit" class="doodle-input w-full" placeholder="e.g. 3" min="0">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block font-bold">Level</label>
                        <select id="clevel" class="doodle-input w-full">
                            <option value="100">100</option>
                            <option value="200">200</option>
                            <option value="300">300</option>
                            <option value="400">400</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block font-bold">Semester</label>
                        <select id="csem" class="doodle-input w-full">
                            <option value="1st">1st Semester</option>
                            <option value="2nd">2nd Semester</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeSelectModal()" class="doodle-button flex-1 bg-gray-200">Cancel</button>
                    <button type="submit" class="doodle-button flex-1 bg-success text-white">Select</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/lecturer-dashboard.js"></script>
</body>
</html>
