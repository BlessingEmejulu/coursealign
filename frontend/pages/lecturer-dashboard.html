<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecturer Dashboard - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#49B6E5', secondary: '#263D5B', success: '#16A34A', warning: '#D97706', surface: '#FFFFFF', text: '#111827' } } }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex text-text">

    <!-- Sidebar -->
    <aside class="w-64 bg-surface h-screen sticky top-0 border-r-2 border-text border-dashed p-6 flex flex-col hidden md:flex">
        <div class="text-2xl font-bold text-secondary mb-10 text-center doodle-border p-2">CourseAlign</div>
        
        <nav class="flex-grow space-y-4">
            <a href="lecturer-dashboard.html" class="block p-3 doodle-border bg-primary text-text font-bold">My Courses</a>
        </nav>
        
        <div class="mt-auto">
            <button onclick="logout()" class="w-full text-center text-red-600 font-bold hover:underline">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-8">
        
        <!-- Welcome Banner -->
        <div class="doodle-border bg-primary p-6 md:p-10 mb-8 relative overflow-hidden flex justify-between items-center">
            <div class="relative z-10">
                <h1 id="welcome-msg" class="text-3xl md:text-4xl font-bold mb-2">Lecturer Portal</h1>
                <p class="text-lg opacity-90">Manage your course outlines and provide resources to students.</p>
            </div>
            <div class="relative z-10 hidden md:block">
                <button onclick="openCreateModal()" class="doodle-button bg-surface text-secondary shadow-lg">+ Create New Course</button>
            </div>
        </div>
        
        <!-- Mobile Create Button -->
        <div class="mb-8 md:hidden">
            <button onclick="openCreateModal()" class="doodle-button bg-secondary text-white w-full">+ Create New Course</button>
        </div>

        <h3 class="text-2xl font-bold text-secondary mb-4">Courses You Teach</h3>

        <!-- Dashboard Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="courseGrid">
            <!-- Courses fetched here -->
        </div>
    </main>

    <!-- Create Course Modal -->
    <div id="createModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="doodle-border bg-surface p-6 max-w-lg w-full">
            <h2 class="text-2xl font-bold mb-4">Create New Course</h2>
            <form id="createCourseForm" class="space-y-4">
                <div>
                    <label class="block font-bold">Course Code</label>
                    <input type="text" id="ccode" class="doodle-input w-full" placeholder="e.g. CSC101" required>
                </div>
                <div>
                    <label class="block font-bold">Course Title</label>
                    <input type="text" id="ctitle" class="doodle-input w-full" placeholder="e.g. Intro to Computer Science" required>
                </div>
                <div>
                    <label class="block font-bold">Credit Units</label>
                    <input type="number" id="cunit" class="doodle-input w-full" required>
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block font-bold">Level</label>
                        <select id="clevel" class="doodle-input w-full">
                            <option value="100">100</option>
                            <option value="200">200</option>
                            <option value="300">300</option>
                            <option value="400">400</option>
                        </select>
                    </div>
                    <div class="flex-1">
                        <label class="block font-bold">Semester</label>
                        <select id="csem" class="doodle-input w-full">
                            <option value="1st">1st Semester</option>
                            <option value="2nd">2nd Semester</option>
                        </select>
                    </div>
                </div>
                <div class="flex gap-4 pt-4">
                    <button type="button" onclick="closeCreateModal()" class="doodle-button flex-1 bg-gray-200">Cancel</button>
                    <button type="submit" class="doodle-button flex-1 bg-success text-white">Create</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
                return JSON.parse(jsonPayload);
            } catch(e) {
                return null;
            }
        }

        const token = localStorage.getItem('token');
        let lecturerName = "Lecturer";
        if (token) {
            const payload = parseJwt(token);
            if (payload) lecturerName = payload.sub;
        }

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }

        function openCreateModal() { document.getElementById('createModal').classList.remove('hidden'); }
        function closeCreateModal() { document.getElementById('createModal').classList.add('hidden'); }

        document.getElementById('createCourseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!token) { alert("You must be logged in."); return; }

            const payload = {
                code: document.getElementById('ccode').value,
                title: document.getElementById('ctitle').value,
                credit_unit: parseInt(document.getElementById('cunit').value),
                level: document.getElementById('clevel').value,
                semester: document.getElementById('csem').value,
                lecturer_name: lecturerName
            };

            try {
                const res = await fetch('http://localhost:8000/api/courses/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    alert("Course created successfully!");
                    closeCreateModal();
                    fetchMyCourses();
                } else {
                    const err = await res.json();
                    alert(err.detail || "Failed to create course.");
                }
            } catch(err) {
                console.error(err);
                alert("Error communicating with server.");
            }
        });

        async function fetchMyCourses() {
            const grid = document.getElementById('courseGrid');
            try {
                const res = await fetch('http://localhost:8000/api/courses/');
                if (res.ok) {
                    const courses = await res.json();
                    // Filter courses created by this lecturer
                    const myCourses = courses.filter(c => c.lecturer_name === lecturerName);
                    
                    grid.innerHTML = '';
                    if (myCourses.length === 0) {
                        grid.innerHTML = '<p class="text-gray-500">You have not created any courses yet.</p>';
                        return;
                    }

                    myCourses.forEach(c => {
                        const card = document.createElement('div');
                        card.className = 'doodle-border p-6 bg-surface flex flex-col';
                        card.innerHTML = `
                            <span class="font-bold px-3 py-1 bg-yellow-200 text-text rounded-full border-2 border-text text-sm self-start mb-2">${c.code}</span>
                            <h4 class="text-xl font-bold mb-2">${c.title}</h4>
                            <p class="text-sm text-gray-600 mb-4">${c.credit_unit} Units | Level ${c.level}</p>
                            <div class="mt-auto pt-4 border-t-2 border-dashed border-gray-200">
                                <a href="lecturer-manage-course.html?code=${c.code}" class="doodle-button block text-center bg-secondary text-white">Manage Content</a>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                }
            } catch (err) {
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!token) window.location.href = 'login.html';
            if (lecturerName !== "Lecturer") {
                document.getElementById('welcome-msg').innerText = `Lecturer Portal - Welcome ${lecturerName}`;
            }
            fetchMyCourses();
        });
    </script>
</body>
</html>
