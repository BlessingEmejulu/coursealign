<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#49B6E5', secondary: '#263D5B', success: '#16A34A', warning: '#D97706', surface: '#FFFFFF', text: '#111827' } } }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-text">

    <!-- Header -->
    <header class="w-full p-4 border-b-2 border-text border-dashed bg-surface flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="doodle-button bg-gray-100 px-3 py-1">Back</a>
            <h1 class="text-xl font-bold text-secondary">My Bookmarks</h1>
        </div>
        <div>
            <span class="text-warning font-bold flex items-center gap-2">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                Saved Courses
            </span>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto p-4 md:p-8">
        
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-secondary mb-2">Bookmarked Courses</h2>
            <p class="text-gray-600 font-bold">Quickly access the courses you've saved for this semester.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="bookmarksGrid">
            <!-- Bookmarks will be dynamically injected here -->
        </div>
    </main>
    
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const bookmarksGrid = document.getElementById('bookmarksGrid');

            const fetchBookmarks = async () => {
                try {
                    const token = localStorage.getItem('token');
                    if (!token) {
                        bookmarksGrid.innerHTML = '<p class="col-span-full text-center text-red-500 py-8">Please login to view bookmarks.</p>';
                        return;
                    }

                    const headers = { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    };

                    const response = await fetch('http://localhost:8000/api/bookmarks/', { headers });
                    if (response.ok) {
                        const bookmarks = await response.json();
                        renderBookmarks(bookmarks);
                    } else {
                        bookmarksGrid.innerHTML = '<p class="col-span-full text-center text-red-500 py-8">Failed to load bookmarks. Please try again later.</p>';
                    }
                } catch (error) {
                    console.error('Error fetching bookmarks:', error);
                    bookmarksGrid.innerHTML = '<p class="col-span-full text-center text-red-500 py-8">Error loading bookmarks. Is the backend running?</p>';
                }
            };

            const renderBookmarks = (bookmarks) => {
                bookmarksGrid.innerHTML = '';
                if (bookmarks.length === 0) {
                    bookmarksGrid.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">You have no bookmarked courses yet.</p>';
                    return;
                }
                
                bookmarks.forEach(bookmark => {
                    const course = bookmark.course;
                    if (!course) return; // Skip if course data is missing
                    
                    const card = document.createElement('div');
                    card.className = 'doodle-border p-6 bg-surface flex flex-col hover:-translate-y-1 transition-transform relative border-warning';
                    
                    let bgClass = 'bg-primary';
                    if (course.level === '100') bgClass = 'bg-green-300';
                    if (course.level === '200') bgClass = 'bg-yellow-300';
                    if (course.level === '300') bgClass = 'bg-primary';
                    if (course.level === '400') bgClass = 'bg-purple-300';

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <span class="font-bold px-3 py-1 ${bgClass} text-text rounded-full border-2 border-text text-sm">${course.code}</span>
                            <button class="text-warning hover:text-gray-400 transition remove-bookmark-btn" data-course-id="${course.id}" title="Remove Bookmark">
                                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                            </button>
                        </div>
                        <h3 class="text-xl font-bold mb-2">${course.title}</h3>
                        <p class="text-xs font-bold text-secondary mb-2">Lecturer: ${course.lecturer_name || 'TBA'}</p>
                        <p class="text-gray-600 mb-4 flex-grow line-clamp-3">${course.description || ''}</p>
                        <div class="flex justify-between items-center text-sm border-t-2 border-dashed border-gray-300 pt-4 mt-auto gap-2">
                            <span>Units: <span class="font-bold">${course.credit_unit}</span></span>
                            <span>Level: <span class="font-bold">${course.level}</span></span>
                            <span>Sem: <span class="font-bold">${course.semester}</span></span>
                        </div>
                        <div class="mt-4 flex gap-2">
                            <a href="course-detail.html?code=${course.code}" class="doodle-button flex-grow text-center bg-surface hover:bg-gray-50">View Course</a>
                        </div>
                    `;
                    bookmarksGrid.appendChild(card);
                });

                // Attach remove bookmark events
                document.querySelectorAll('.remove-bookmark-btn').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const courseId = e.currentTarget.getAttribute('data-course-id');
                        await removeBookmark(courseId);
                    });
                });
            };

            const removeBookmark = async (courseId) => {
                try {
                    const token = localStorage.getItem('token');
                    const headers = { 
                        'Authorization': `Bearer ${token}`
                    };

                    const response = await fetch(`http://localhost:8000/api/bookmarks/${courseId}`, { 
                        method: 'DELETE',
                        headers 
                    });

                    if (response.ok) {
                        fetchBookmarks();
                    } else {
                        console.error('Failed to remove bookmark');
                        alert('Failed to remove bookmark.');
                    }
                } catch (error) {
                    console.error('Error removing bookmark:', error);
                }
            };

            fetchBookmarks();
        });
    </script>

</body>
</html>
