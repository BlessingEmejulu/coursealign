<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookmarks - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    
    
    <script src="../js/config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-text">

    <!-- Header -->
    <header class="w-full p-4 border-b-2 border-text border-dashed bg-surface flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="doodle-button bg-gray-100 px-3 py-1">Back</a>
            <h1 class="text-xl font-bold text-secondary">My Bookmarks</h1>
        </div>
        <div>
            <span class="text-warning font-bold flex items-center gap-2">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                Saved Courses
            </span>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto p-4 md:p-8">
        
        <div class="mb-8">
            <h2 class="text-3xl font-bold text-secondary mb-2">Bookmarked Courses</h2>
            <p class="text-gray-600 font-bold">Quickly access the courses you've saved for this semester.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="bookmarksGrid">
            <!-- Bookmarks will be dynamically injected here -->
        </div>
    </main>
    
    <script src="../js/bookmarks.js"></script>

</body>
</html>
