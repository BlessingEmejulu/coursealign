<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Courses - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    
    
    <script src="../js/config.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-text">

    <!-- Header -->
    <header class="w-full p-4 border-b-2 border-text border-dashed bg-surface flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="doodle-button bg-gray-100 px-3 py-1">Back</a>
            <h1 class="text-xl font-bold text-secondary">Browse Courses</h1>
        </div>
    </header>

    <main class="flex-grow w-full max-w-6xl mx-auto p-4 md:p-8">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <input type="text" id="searchInput" class="doodle-input md:w-1/2 flex-grow" placeholder="Search courses by code or title...">
            <div class="flex w-full md:w-1/2 gap-4">
                <select id="levelFilter" class="doodle-input flex-1 cursor-pointer">
                    <option value="">All Levels</option>
                    <option value="100">100 Level</option>
                    <option value="200">200 Level</option>
                    <option value="300">300 Level</option>
                    <option value="400">400 Level</option>
                </select>
                <select id="semesterFilter" class="doodle-input flex-1 cursor-pointer">
                    <option value="">All Semesters</option>
                    <option value="1st">1st Semester</option>
                    <option value="2nd">2nd Semester</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="courseGrid">
            <!-- Courses will be dynamically injected here -->
        </div>
    </main>

    <script src="../js/courses.js"></script>
</body>
</html>
