<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Quiz - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { primary: '#49B6E5', secondary: '#263D5B', success: '#16A34A', warning: '#D97706', surface: '#FFFFFF', text: '#111827' } } }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-text">

    <!-- Header -->
    <header class="w-full p-4 border-b-2 border-text border-dashed bg-surface flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <a href="courses.html" id="backBtn" class="doodle-button bg-gray-100 px-3 py-1">Back</a>
            <h1 class="text-xl font-bold text-secondary" id="quizTitle">AI Quiz</h1>
        </div>
        <div>
            <span class="font-bold text-lg text-primary" id="scoreDisplay">Loading...</span>
        </div>
    </header>

    <main class="flex-grow w-full max-w-3xl mx-auto p-4 md:p-8">
        
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold mb-2">Knowledge Check</h2>
            <p class="text-gray-600">Generated by CourseAlign AI Tutor (Gemma 4).</p>
        </div>

        <div id="loadingContainer" class="text-center py-10">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-4 border-primary border-solid mb-4"></div>
            <p class="text-gray-600 font-bold">Generating unique quiz questions...</p>
        </div>

        <form id="quizForm" class="space-y-8 hidden">
            <div id="questionsContainer" class="space-y-8"></div>
            <div class="flex justify-end pt-4">
                <button type="submit" id="submitBtn" class="doodle-button bg-success text-white px-8 py-3 text-lg">Submit Quiz</button>
            </div>
        </form>

        <div id="resultsContainer" class="mt-8 hidden p-6 doodle-border bg-green-50 border-success">
            <h3 class="text-2xl font-bold text-success mb-2">Quiz Results</h3>
            <p id="resultsText" class="text-lg"></p>
            <button onclick="location.reload()" class="mt-4 doodle-button bg-surface">Try Another Quiz</button>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const courseCode = urlParams.get('code');
            const token = localStorage.getItem('token');
            
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            if (!courseCode) {
                document.getElementById('loadingContainer').innerHTML = "<p class='text-red-500 font-bold'>No course code provided.</p>";
                return;
            }

            document.getElementById('quizTitle').innerText = `AI Quiz: ${courseCode}`;
            document.getElementById('backBtn').href = `course-detail.html?code=${courseCode}`;

            let correctAnswers = [];

            try {
                const res = await fetch(`http://localhost:8000/api/ai/quiz/${courseCode}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.ok) {
                    const data = await res.json();
                    let questionsStr = data.quiz;
                    // Try to clean up markdown if the AI includes it
                    if (questionsStr.startsWith('```json')) {
                        questionsStr = questionsStr.replace('```json', '').replace('```', '');
                    }
                    
                    const questions = JSON.parse(questionsStr);
                    correctAnswers = questions.map(q => q.answer);
                    
                    const container = document.getElementById('questionsContainer');
                    questions.forEach((q, index) => {
                        const qDiv = document.createElement('div');
                        qDiv.className = 'doodle-border p-6 bg-surface';
                        
                        let optionsHtml = '';
                        q.options.forEach((opt, optIndex) => {
                            optionsHtml += `
                            <label class="flex items-center gap-3 p-3 border-2 border-text rounded-lg cursor-pointer hover:bg-gray-50 transition">
                                <input type="radio" name="q${index}" value="${opt.replace(/"/g, '&quot;')}" class="w-5 h-5 accent-primary" required>
                                <span>${opt}</span>
                            </label>
                            `;
                        });

                        qDiv.innerHTML = `
                            <h3 class="text-xl font-bold mb-4">${index + 1}. ${q.question}</h3>
                            <div class="space-y-3">
                                ${optionsHtml}
                            </div>
                        `;
                        container.appendChild(qDiv);
                    });

                    document.getElementById('loadingContainer').classList.add('hidden');
                    document.getElementById('quizForm').classList.remove('hidden');
                    document.getElementById('scoreDisplay').innerText = `0/${questions.length} Answered`;
                    
                    // Update score display on change
                    document.getElementById('quizForm').addEventListener('change', () => {
                        const formData = new FormData(document.getElementById('quizForm'));
                        let answeredCount = 0;
                        for(let pair of formData.entries()) {
                            answeredCount++;
                        }
                        document.getElementById('scoreDisplay').innerText = `${answeredCount}/${questions.length} Answered`;
                    });

                    document.getElementById('quizForm').addEventListener('submit', (e) => {
                        e.preventDefault();
                        const formData = new FormData(e.target);
                        let score = 0;
                        
                        questions.forEach((q, index) => {
                            const userAnswer = formData.get(`q${index}`);
                            if (userAnswer === q.answer) {
                                score++;
                            }
                        });

                        document.getElementById('quizForm').classList.add('hidden');
                        document.getElementById('resultsContainer').classList.remove('hidden');
                        document.getElementById('resultsText').innerText = `You scored ${score} out of ${questions.length}!`;
                    });

                } else {
                    document.getElementById('loadingContainer').innerHTML = "<p class='text-red-500 font-bold'>Failed to load quiz.</p>";
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loadingContainer').innerHTML = "<p class='text-red-500 font-bold'>Error communicating with AI server.</p>";
            }
        });
    </script>
</body>
</html>
