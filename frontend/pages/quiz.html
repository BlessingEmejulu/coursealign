<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Quiz - CourseAlign</title>
    <link rel="stylesheet" href="../css/style.css">
    
    
    <script src="../js/config.js"></script>

    <!-- Tailwind CSS (Play CDN for Vanilla HTML/JS setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#49B6E5', secondary: '#263D5B', success: '#16A34A', warning: '#D97706', danger: '#DC2626', surface: '#FFFFFF', text: '#111827' },
                    fontFamily: { sans: ['"Delius Swash Caps"', 'cursive'], mono: ['"JetBrains Mono"', 'monospace'] },
                    animation: { 'bounce-slow': 'bounce 3s infinite', 'wiggle': 'wiggle 1s ease-in-out infinite' },
                    keyframes: { wiggle: { '0%, 100%': { transform: 'rotate(-3deg)' }, '50%': { transform: 'rotate(3deg)' } } }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col text-text">

    <!-- Header -->
    <header class="w-full p-4 border-b-2 border-text border-dashed bg-surface flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center gap-4">
            <a href="courses.html" id="backBtn" class="doodle-button bg-gray-100 px-3 py-1">Back</a>
            <h1 class="text-xl font-bold text-secondary" id="quizTitle">AI Quiz</h1>
        </div>
        <div>
            <span class="font-bold text-lg text-primary" id="scoreDisplay">Loading...</span>
        </div>
    </header>

    <main class="flex-grow w-full max-w-3xl mx-auto p-4 md:p-8">
        
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold mb-2">Knowledge Check</h2>
            <p class="text-gray-600">Generated by CourseAlign AI Tutor (Gemma 4).</p>
        </div>

        <div id="settingsContainer" class="doodle-border p-6 bg-surface mb-8">
            <h3 class="text-xl font-bold mb-4">Quiz Settings</h3>
            <form id="settingsForm" class="space-y-4">
                <div>
                    <label class="block font-bold mb-2">Difficulty</label>
                    <select id="difficulty" class="w-full p-2 border-2 border-text rounded bg-gray-50 focus:outline-none focus:border-primary">
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold mb-2">Number of Questions</label>
                    <input type="number" id="numQuestions" value="5" min="1" max="50" class="w-full p-2 border-2 border-text rounded bg-gray-50 focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block font-bold mb-2">Question Types</label>
                    <div class="flex gap-4">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="type-mcq" checked class="w-5 h-5 accent-primary">
                            <span>Multiple Choice (MCQ)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" id="type-tf" class="w-5 h-5 accent-primary">
                            <span>True/False</span>
                        </label>
                    </div>
                    <p id="typeError" class="text-red-500 text-sm hidden mt-1">Please select at least one question type.</p>
                </div>
                <div class="pt-4 text-center">
                    <button type="submit" class="doodle-button bg-primary text-text px-8 py-3 text-lg w-full md:w-auto">Generate Quiz</button>
                </div>
            </form>
        </div>

        <div id="loadingContainer" class="text-center py-10 hidden">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-4 border-primary border-solid mb-4"></div>
            <p class="text-gray-600 font-bold" id="loadingText">Generating unique quiz questions...</p>
        </div>

        <form id="quizForm" class="space-y-8 hidden">
            <div id="questionsContainer" class="space-y-8"></div>
            <div class="flex justify-end pt-4">
                <button type="submit" id="submitBtn" class="doodle-button bg-success text-white px-8 py-3 text-lg">Submit Quiz</button>
            </div>
        </form>

        <div id="resultsContainer" class="mt-8 hidden space-y-6">
            <div class="p-6 doodle-border bg-green-50 border-success text-center">
                <h3 class="text-3xl font-bold text-success mb-2">Quiz Results</h3>
                <p id="resultsText" class="text-2xl font-bold"></p>
                <p id="resultsStats" class="text-gray-700 mt-2"></p>
            </div>
            
            <div class="p-6 doodle-border bg-blue-50">
                <h3 class="text-xl font-bold text-secondary mb-4 border-b-2 border-dashed border-gray-300 pb-2">Personalized Feedback</h3>
                <div id="feedbackLoading" class="flex items-center gap-3 text-primary font-bold">
                    <div class="animate-spin rounded-full h-5 w-5 border-t-2 border-primary"></div>
                    Generating feedback from Gemma...
                </div>
                <div id="feedbackContent" class="hidden">
                    <p id="feedbackText" class="text-lg text-gray-800 mb-4"></p>
                    <h4 class="font-bold text-gray-700 mb-2">Suggested Topics to Review:</h4>
                    <ul id="suggestedTopics" class="list-disc pl-5 space-y-1 text-gray-800"></ul>
                </div>
            </div>

            <div id="answersReviewContainer" class="space-y-6"></div>
            
            <div class="text-center pt-4">
                <button onclick="location.reload()" class="doodle-button bg-primary text-text px-8 py-3 text-lg">Generate Another Quiz</button>
            </div>
        </div>

    </main>

    <script src="../js/quiz.js"></script>
</body>
</html>
