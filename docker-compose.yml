version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/coursealign.db:/app/coursealign.db
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_CHAT_URL=http://ollama:11434/api/chat
      - E2B_API_KEY=${E2B_API_KEY:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ~/.ollama:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 4G

