version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/coursealign.db:/app/coursealign.db
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - OLLAMA_CHAT_URL=http://ollama:11434/api/chat
      - E2B_API_KEY=${E2B_API_KEY:-}
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 10 &&
      ollama run gemma:2b &&
      wait
      "

volumes:
  ollama_data:
